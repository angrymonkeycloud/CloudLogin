<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>CloudLogin Demo Inbox</title>
  <link rel="stylesheet" href="/demo/css/inbox.css" />
</head>
<body>
  <h1>CloudLogin Demo Inbox</h1>
  <p class="hint">
    This demo has no real SMTP server. When you sign in with the Email/Code provider,
    the verification code appears here instead of in an email. Switch between Authentication and this inbox
    in the authority workshop.
  </p>
  <table>
    <thead>
      <tr><th>Address</th><th>Code</th><th>Sent</th></tr>
    </thead>
    <tbody id="entries"></tbody>
  </table>
  <p id="empty" class="empty">No codes sent yet.</p>

  <script src="/demo/js/inbox.js"></script>
</body>
</html>
